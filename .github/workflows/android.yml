name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_SIGNING: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        if: env.HAS_SIGNING == 'true'
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/lazee.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/lazee.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --stacktrace testDebugUnitTest assembleDebug

      - name: Check merged manifest has no network permission
        run: |
          manifests=$(find app/build/intermediates -name AndroidManifest.xml -path '*merged_manifest*debug*')
          echo "$manifests"
          test -n "$manifests"
          if grep -l -E 'android.permission.(INTERNET|ACCESS_NETWORK_STATE)' $manifests; then
            echo "::error::Network permission found in merged manifest"; exit 1
          fi

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests
          retention-days: 7

      - name: Rename APK
        id: apk
        run: |
          name="lazee-v1.0.0-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: lazee-apk
          path: ${{ steps.apk.outputs.name }}
          retention-days: 14

      - name: Release notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          {
            echo "Build ${{ github.run_number }} from ${GITHUB_SHA::7}."
            if [ "$HAS_SIGNING" != "true" ]; then
              echo ""
              echo "⚠️ 这个版本没有用固定签名：要先删掉旧版才能装。 / Not signed with the shared key: uninstall the old version first."
            fi
          } > notes.md

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_number }}
          name: Lazee build ${{ github.run_number }}
          prerelease: true
          body_path: notes.md
          files: ${{ steps.apk.outputs.name }}

      - name: Keep only the newest 5 builds
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done
